controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
    
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      
    # gains:
    #   joint_1: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    #   joint_2: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    #   joint_3: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    #   joint_4: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    #   joint_5: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    #   joint_6: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    gains:
      joint_1: {p: 500.0, i: 50.0, d: 10.0}
      joint_2: {p: 800.0, i: 80.0, d: 15.0}
      joint_3: {p: 600.0, i: 60.0, d: 10.0}
      joint_4: {p: 300.0, i: 30.0, d: 5.0}
      joint_5: {p: 200.0, i: 20.0, d: 3.0}
      joint_6: {p: 100.0, i: 10.0, d: 1.0}